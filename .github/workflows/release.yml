name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true
      - name: Export
        run: |
          mkdir -p build/windows build/linux build/web dist && touch build/.gdignore
          godot --headless --import || true
          godot --headless --export-release "Windows" build/windows/StormDrop.exe
          godot --headless --export-release "Linux" build/linux/StormDrop.x86_64
          godot --headless --export-release "Web" build/web/index.html
          apt-get update -qq && apt-get install -y -qq zip >/dev/null || true
          (cd build/windows && zip -r ../../dist/StormDrop-$TAG-windows.zip .)
          (cd build/linux && chmod +x StormDrop.x86_64 && zip -r ../../dist/StormDrop-$TAG-linux.zip .)
          (cd build/web && zip -r ../../dist/StormDrop-$TAG-web.zip .)
          ls -la dist
      - name: Export Android APK (signed with a generated debug keystore)
        run: |
          mkdir -p build/android
          keytool -genkeypair -v -keystore /tmp/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          SDK=${ANDROID_HOME:-/usr/lib/android-sdk}
          ls ~/.config/godot/ /root/.config/godot/ || true
          EP=$(ls ~/.config/godot/editor_settings-4*.tres 2>/dev/null | head -1)
          if [ -z "$EP" ]; then EP=~/.config/godot/editor_settings-4.3.tres; mkdir -p ~/.config/godot; printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > $EP; fi
          if ! command -v javac >/dev/null; then apt-get update -qq && apt-get install -y -qq openjdk-17-jdk-headless >/dev/null; fi
          JAVA=$(dirname $(dirname $(readlink -f $(which javac))))
          echo "SDK=$SDK JAVA=$JAVA EP=$EP"
          sed -i '/android_sdk_path\|java_sdk_path/d' $EP
          echo "export/android/android_sdk_path = \"$SDK\"" >> $EP
          echo "export/android/java_sdk_path = \"$JAVA\"" >> $EP
          cat $EP | grep android
          godot --headless --export-debug "Android" build/android/StormDrop.apk
          BT=$(ls -d $SDK/build-tools/* | tail -1)
          $BT/apksigner verify --verbose build/android/StormDrop.apk
          unzip -l build/android/StormDrop.apk | grep -E "lib/(arm64-v8a|armeabi-v7a)/"
          cp build/android/StormDrop.apk dist/StormDrop.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Storm Drop ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body: |
            Storm Drop ${{ env.TAG }}: original battle royale made in Godot 4.3.
            - **Windows:** unzip and run StormDrop.exe
            - **Linux:** unzip and run ./StormDrop.x86_64
            - **Android:** download StormDrop.apk on your phone, open it and allow "Install unknown apps"
            - **Web:** unzip and serve the folder over HTTP, or play at https://toer15.github.io/storm-drop/
          files: |
            dist/*.zip
            dist/*.apk
