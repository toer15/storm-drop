name: probe-asset-hosts
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://static.poly.pizza/713f6535-f4f3-4367-a4c6-ced126ae0936.glb https://opengameart.org/sites/default/files/universal_animation_librarystandard.zip https://opengameart.org/sites/default/files/fight_looped.ogg https://kenney.nl/media/pages/assets/particle-pack/f8fe0f8cb8-1677578741/kenney_particle-pack.zip; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36' -e https://poly.pizza/ "$u")"
            echo "$u (python UA) -> $(curl -s -o /dev/null -w '%{http_code}' -A 'storm-drop-fetch' "$u")"
          done
